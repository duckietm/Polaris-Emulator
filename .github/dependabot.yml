version: 2
updates:
  # Compatible updates (minor and patch) arrive as one weekly pull request; a major version is not
  # proposed, it is a decision. Dependabot waits three days after a release before it proposes it.
  - package-ecosystem: "maven"
    directory: "/Emulator"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"

  # Workflow actions: every update, majors included, in one pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
