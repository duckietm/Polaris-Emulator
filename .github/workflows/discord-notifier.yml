name: Discord Main Branch Notifier

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.head_commit != null
    steps:
      - name: Collect diff stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          echo '{}' > compare.json

          # all-zero SHA = brand new branch, nothing to compare against
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API/repos/$REPO/compare/$BEFORE...$AFTER" \
              -o compare.json || echo '{}' > compare.json
          fi

          # sanity check: if the API returned an error object, discard it
          if ! jq -e '.stats' compare.json > /dev/null 2>&1; then
            echo "Compare API gave no stats, falling back to event payload"
            echo '{}' > compare.json
          fi

      - name: Send Discord Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(jq -c --slurpfile stats compare.json '
            .head_commit as $c
            | (.repository.full_name) as $repo
            | (.ref | sub("refs/heads/"; "")) as $branch
            | ($c.message | split("\n")[0]) as $title
            | ($c.message | split("\n")[1:] | join("\n")) as $body
            | ($stats[0] // {}) as $s
            | ([.commits[]? | (.added[]?, .modified[]?, .removed[]?)] | unique | length) as $fallbackFiles
            | (($s.files // []) | length) as $apiFiles
            | (if $apiFiles > 0 then $apiFiles else $fallbackFiles end) as $fileCount
            | (if $apiFiles >= 300 then "300+" else ($fileCount | tostring) end) as $filesLabel
            | ($s.stats.additions // 0) as $add
            | ($s.stats.deletions // 0) as $del
            | ($s.total_commits // (.commits | length)) as $commitCount

            | {
                username: "Octane - Main",
                avatar_url: "https://images.habbo.com/c_images/album1584/EST08.gif",
                embeds: [
                  {
                    author: {
                      name: ($c.author.username // $c.author.name),
                      url: ("https://github.com/" + ($c.author.username // "")),
                      icon_url: (.sender.avatar_url)
                    },
                    title: ("🏨  " + ($title | .[0:230])),
                    url: $c.url,
                    description: (
                      (if ($body | gsub("\\s"; "") | length) > 0
                        then ($body | .[0:1400]) + "\n\n"
                        else ""
                      end)
                      + "**Room:** `" + $repo + "`  •  **Branch:** `" + $branch + "`\n"
                      + "**Commit:** [`" + ($c.id[0:7]) + "`](" + $c.url + ")"
                      + "  •  [compare](" + .compare + ")"
                    ),
                    color: 16751616,
                    thumbnail: {
                      url: "https://www.habbo.com/habbo-imaging/avatarimage?figure=hr-165-45.hd-180-2.ch-255-66.lg-280-110.sh-305-62&direction=2&head_direction=3&size=l&action=wav"
                    },
                    fields: [
                      { name: "📦 Files changed", value: ("```" + $filesLabel + "```"), inline: true },
                      { name: "🟩 Added",         value: ("```diff\n+" + ($add | tostring) + "```"), inline: true },
                      { name: "🟥 Removed",       value: ("```diff\n-" + ($del | tostring) + "```"), inline: true }
                    ],
                    footer: {
                      text: ($repo + " • " + ($commitCount | tostring) + " commit(s) pushed to " + $branch),
                      icon_url: "https://github.githubassets.com/favicons/favicon.png"
                    },
                    timestamp: $c.timestamp
                  }
                ]
              }
          ' "$GITHUB_EVENT_PATH")

          curl -sS -f \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$WEBHOOK_URL"